# El sitio es HTML estatico en la raiz del repositorio. No hay npm, ni
# bundler, ni paso de compilacion: el comando solo reune en _site la lista
# de archivos que se publican, para que el material de trabajo de la raiz
# (prompts, guia de identidad, referencia, originales de video) no se sirva
# desde el dominio.
[build]
  command = "bash tools/publicar.sh"
  publish = "_site"
