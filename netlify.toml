# El sitio vive en app/, no en la raiz del repo. No usamos "base" para no
# depender de como Netlify resuelve "publish" respecto a el: el comando entra
# en la subcarpeta y "publish" queda relativo a la raiz, que no es ambiguo.
[build]
  command = "npm --prefix app ci && npm --prefix app run build"
  publish = "app/dist"

[build.environment]
  NODE_VERSION = "20"
