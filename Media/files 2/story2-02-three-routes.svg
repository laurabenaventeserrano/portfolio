<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><style>
.tl{font-family:'Roboto Mono',ui-monospace,monospace;font-size:13px;letter-spacing:1.4px;fill:#7A7A80}
.tt{font-family:Roboto,Arial,sans-serif;font-size:17px;font-weight:500;fill:#0E0E11}
.ts{font-family:Roboto,Arial,sans-serif;font-size:14px;fill:#7A7A80}
.tb{font-family:Georgia,'Times New Roman',serif;font-size:30px;fill:#0E0E11}
</style><rect width="1200" height="900" fill="#F6F4EF"/><text class="tl" x="70" y="86">STORY 02 · THE CONTEXT</text><text class="tb" x="70" y="146">How a document got written</text><line x1="70" y1="182" x2="1130" y2="182" stroke="rgba(14,14,17,.16)" stroke-width="1.5"/><rect x="70" y="230" width="320" height="190" fill="#EEEBE3"/><text class="tt" x="96" y="278" fill="#0E0E11" style="font-size:20px">Predefined template</text><text class="ts" x="96" y="318">Rigid. Rarely a real fit.</text><text class="ts" x="96" y="348">Heavy editing anyway.</text><path d="M230 420 V500" stroke="rgba(14,14,17,.3)" stroke-width="1.6" stroke-dasharray="4 6"/><rect x="430" y="230" width="320" height="190" fill="#EEEBE3"/><text class="tt" x="456" y="278" fill="#0E0E11" style="font-size:20px">Write it by hand</text><text class="ts" x="456" y="318">Slow. From an empty page.</text><text class="ts" x="456" y="348">Typing errors carry risk.</text><path d="M590 420 V500" stroke="rgba(14,14,17,.3)" stroke-width="1.6" stroke-dasharray="4 6"/><rect x="790" y="230" width="320" height="190" fill="#FFFFFF" stroke="#B23A20" stroke-width="2.5"/><text class="tt" x="816" y="278" fill="#B23A20" style="font-size:20px">Leave and come back</text><text class="ts" x="816" y="318">Draft it in another tool,</text><text class="ts" x="816" y="348">paste the result back in.</text><path d="M950 420 V500" stroke="#B23A20" stroke-width="1.6" stroke-dasharray="4 6"/><rect x="70" y="500" width="1060" height="80" fill="#0E0E11"/><text class="tt" x="100" y="548" fill="#F6F4EF" style="font-size:21px">Document sent to the end client for signature</text><text class="ts" x="70" y="660" style="font-size:17px">The third route was the one nobody had designed —</text><text class="ts" x="70" y="692" style="font-size:17px">and the one that took the work outside the product.</text><text class="tl" x="70" y="840">RECONSTRUCTED · ROUTES, NOT INTERFACES</text></svg>