</style><rect width="1600" height="800" fill="#F6F4EF"/><text class="tl" x="70" y="86">STORY 01 · SCOPE</text><text class="tb" x="70" y="146">What I chose not to build</text><line x1="70" y1="182" x2="1530" y2="182" stroke="rgba(14,14,17,.16)" stroke-width="1.5"/><text class="tl" x="70" y="240">FULL CONCEPT SCOPE</text><text class="tl" x="1080" y="240">FIRST RELEASE — UK</text><rect x="70" y="266" width="400" height="42" fill="#D8D3C6"/><text class="tt" x="94" y="293">Client context model</text><rect x="70" y="320" width="400" height="42" fill="#D8D3C6"/><text class="tt" x="94" y="347">Portfolio dashboard</text><rect x="70" y="374" width="400" height="42" fill="#D8D3C6"/><text class="tt" x="94" y="401">Firm and client filtering</text><rect x="70" y="428" width="400" height="42" fill="#EEEBE3"/><text class="tt" x="94" y="455" fill="#A0A0A6">Advanced data widgets</text><rect x="70" y="482" width="400" height="42" fill="#EEEBE3"/><text class="tt" x="94" y="509" fill="#A0A0A6">Secondary dashboards</text><rect x="70" y="536" width="400" height="42" fill="#EEEBE3"/><text class="tt" x="94" y="563" fill="#A0A0A6">Multi-market forms</text><rect x="70" y="590" width="400" height="42" fill="#EEEBE3"/><text class="tt" x="94" y="617" fill="#A0A0A6">Advanced insights</text><path d="M470 287 C700 287 900 330 1080 346" stroke="#1F4396" stroke-width="2" fill="none"/><path d="M470 341 C700 341 900 370 1080 386" stroke="#1F4396" stroke-width="2" fill="none"/><path d="M470 395 C700 395 900 410 1080 426" stroke="#1F4396" stroke-width="2" fill="none"/><path d="M470 449 C740 449 900 560 1050 580" stroke="rgba(14,14,17,.22)" stroke-width="1.4" stroke-dasharray="4 7" fill="none"/><path d="M470 503 C740 503 900 578 1050 598" stroke="rgba(14,14,17,.22)" stroke-width="1.4" stroke-dasharray="4 7" fill="none"/><path d="M470 557 C740 557 900 596 1050 616" stroke="rgba(14,14,17,.22)" stroke-width="1.4" stroke-dasharray="4 7" fill="none"/><path d="M470 611 C740 611 900 614 1050 634" stroke="rgba(14,14,17,.22)" stroke-width="1.4" stroke-dasharray="4 7" fill="none"/><rect x="1080" y="266" width="450" height="180" fill="#0E0E11"/><text class="tl" x="1108" y="306" fill="#8A8A90">SHIPPED FIRST</text><text class="tt" x="1108" y="348" fill="#F6F4EF">One dashboard, centred on client context</text><text class="tt" x="1108" y="382" fill="#F6F4EF">Firm and client filtering</text><text class="tt" x="1108" y="416" fill="#F6F4EF">A clear entry point to the new experience</text><rect x="1050" y="540" width="480" height="120" fill="none" stroke="rgba(14,14,17,.16)" stroke-width="1.5"/><text class="tl" x="1078" y="582">DEFERRED, NOT DISCARDED</text><text class="ts" x="1078" y="616">Scope could not grow until the direction</text><text class="ts" x="1078" y="642">had been validated in one market.</text><text class="tl" x="70" y="760">RECONSTRUCTED · CAPABILITY MODEL, NOT ROADMAP</text></svg>