<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200"><style>
.tl{font-family:'Roboto Mono',ui-monospace,monospace;font-size:13px;letter-spacing:1.4px;fill:#7A7A80}
.tt{font-family:Roboto,Arial,sans-serif;font-size:17px;font-weight:500;fill:#0E0E11}
.ts{font-family:Roboto,Arial,sans-serif;font-size:14px;fill:#7A7A80}
.tb{font-family:Georgia,'Times New Roman',serif;font-size:30px;fill:#0E0E11}
</style><rect width="1000" height="1200" fill="#F6F4EF"/><text class="tl" x="70" y="90">STORY 02 · THE DESIGN</text><text class="tb" x="70" y="150">Review is not a step.</text><text class="tb" x="70" y="192">It is the product.</text><line x1="70" y1="228" x2="930" y2="228" stroke="rgba(14,14,17,.16)" stroke-width="1.5"/><rect x="70" y="280" width="860" height="140" fill="#EEEBE3"/><text class="tl" x="98" y="318" fill="#7A7A80">01 — THE USER</text><text class="tt" x="98" y="356" fill="#0E0E11" style="font-size:21px">Writes an instruction</text><text class="ts" x="98" y="390" fill="#7A7A80">What the document needs to say, in their own words.</text><path d="M500 420 V442" stroke="rgba(14,14,17,.3)" stroke-width="1.6"/><rect x="70" y="442" width="860" height="140" fill="#EEEBE3"/><text class="tl" x="98" y="480" fill="#7A7A80">02 — THE SYSTEM</text><text class="tt" x="98" y="518" fill="#0E0E11" style="font-size:21px">Generates a draft</text><text class="ts" x="98" y="552" fill="#7A7A80">A starting point, inside the product. Never an empty page.</text><path d="M500 582 V604" stroke="rgba(14,14,17,.3)" stroke-width="1.6"/><rect x="70" y="604" width="860" height="140" fill="#FFFFFF" stroke="#B23A20" stroke-width="2.5"/><text class="tl" x="98" y="642" fill="#7A7A80">03 — THE PROFESSIONAL</text><text class="tt" x="98" y="680" fill="#B23A20" style="font-size:21px">Reviews and edits</text><text class="ts" x="98" y="714" fill="#7A7A80">Full editing. Nothing is stored until the human is satisfied.</text><path d="M500 744 V766" stroke="rgba(14,14,17,.3)" stroke-width="1.6"/><rect x="70" y="766" width="860" height="140" fill="#EEEBE3"/><text class="tl" x="98" y="804" fill="#7A7A80">04</text><text class="tt" x="98" y="842" fill="#0E0E11" style="font-size:21px">Saves</text><text class="ts" x="98" y="876" fill="#7A7A80">A deliberate act, not an automatic one.</text><path d="M500 906 V928" stroke="rgba(14,14,17,.3)" stroke-width="1.6"/><rect x="70" y="928" width="860" height="140" fill="#0E0E11"/><text class="tl" x="98" y="966" fill="#8A8A90">05</text><text class="tt" x="98" y="1004" fill="#F6F4EF" style="font-size:21px">Sends for signature</text><text class="ts" x="98" y="1038" fill="#9E9EA6">Reaches the end client only after approval.</text><rect x="70" y="1088" width="700" height="52" fill="none" stroke="#B23A20" stroke-width="2"/><text class="tt" x="98" y="1121" fill="#B23A20">The AI never finishes the document. A person does.</text><text class="tl" x="70" y="1178">RECONSTRUCTED FLOW · NO ORIGINAL UI</text></svg>