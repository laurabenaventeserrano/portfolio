</style><rect width="1200" height="900" fill="#F6F4EF"/><text class="tl" x="70" y="86">STORY 02 · WHAT I GOT WRONG</text><text class="tb" x="70" y="146">Scoped for contracts.</text><text class="tb" x="70" y="188">Used for everything.</text><line x1="70" y1="224" x2="1130" y2="224" stroke="rgba(14,14,17,.16)" stroke-width="1.5"/><text class="tl" x="70" y="290">WHAT I DESIGNED FOR</text><rect x="70" y="312" width="320" height="230" fill="none" stroke="rgba(14,14,17,.16)" stroke-width="1.5"/><rect x="100" y="350" width="240" height="26" fill="#0E0E11"/><rect x="100" y="406" width="200" height="26" fill="#0E0E11"/><rect x="100" y="462" width="225" height="26" fill="#0E0E11"/><text class="ts" x="70" y="586">Formal, structured documents.</text><text class="tl" x="530" y="290">WHAT PEOPLE USED IT FOR</text><rect x="530" y="312" width="600" height="230" fill="none" stroke="#B23A20" stroke-width="1.5"/><rect x="560" y="340" width="200" height="24" fill="#0E0E11"/><rect x="782" y="340" width="140" height="24" fill="#0E0E11"/><rect x="944" y="340" width="110" height="24" fill="#0E0E11"/><rect x="560" y="390" width="160" height="24" fill="#0E0E11"/><rect x="742" y="390" width="190" height="24" fill="#0E0E11"/><rect x="954" y="390" width="100" height="24" fill="#0E0E11"/><rect x="560" y="440" width="230" height="24" fill="#0E0E11"/><rect x="812" y="440" width="120" height="24" fill="#0E0E11"/><rect x="954" y="440" width="130" height="24" fill="#0E0E11"/><rect x="560" y="490" width="130" height="24" fill="#0E0E11"/><rect x="712" y="490" width="210" height="24" fill="#0E0E11"/><rect x="944" y="490" width="110" height="24" fill="#0E0E11"/><text class="ts" x="530" y="586" fill="#B23A20">Anything that needed a client signature.</text><path d="M390 427 H530" stroke="#B23A20" stroke-width="2"/><text class="tt" x="70" y="700" style="font-size:22px">The scope was set by the artefact.</text><text class="tt" x="70" y="738" style="font-size:22px">The need was set by the moment: facing an empty page.</text><text class="tl" x="70" y="840">RECONSTRUCTED · QUALITATIVE OBSERVATION, NOT MEASURED DATA</text></svg>